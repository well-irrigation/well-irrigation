# الفحص التلقائي لكل طلب دمج — ق-120/4
#
# الغرض: أن يكون ما يُدمج في `main` (= نشر على الإنتاج) قد فُحص بآلة لا
# بذاكرة. والفحوص هنا ليست قائمة أوامر ثانية: هي **نفس** سكربتات المستودع
# (`c:app` و`c:db`)، فمعيار النجاح واحد على جهاز المالك وفي السحابة. أي
# قائمة أوامر موازية تتقادم بصمت — وذلك نجاح كاذب في أداة التحقق (ق-113).
name: checks

on:
  pull_request:
  push:
    branches: [main]

# طلب دمج يُدفع إليه مرارًا: يُلغى الفحص القديم ولا يُزاحم الجديد.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# أقل صلاحية ممكنة: الفحص يقرأ الكود ولا يكتب شيئًا في المستودع.
permissions:
  contents: read

jobs:
  app:
    name: كود التطبيق — analyze ثم test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # الإصدار مثبَّت على ما يعمل به المالك (3.47.0 stable) لا على "الأحدث":
      # قناة متحركة تجعل الفحص يفشل وينجح بلا تغيير في الكود.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # الحزم تُهيَّأ هنا بشبكة. بدونها يحاول c:app تهيئة بلا شبكة فيسقط
      # لسبب بيئي لا علاقة له بجودة الكود.
      - name: تهيئة الحزم
        working-directory: apps/mobile
        run: flutter pub get

      - name: npm run c:app
        run: npm run c:app

      # الأداة تكتب سجلها الكامل في ملف لا في المخرَج، فبلا هذه الخطوة
      # يظهر الفشل بلا سببه — وفحصٌ لا يقول لماذا فشل نصف أداة.
      - name: سجل الفحص عند الفشل
        if: failure()
        run: tail -n 60 /tmp/wi-checks/app-test.log || true

  db:
    name: القاعدة — reset ثم tests ثم مطابقة الفهرس
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت أدوات المستودع
        run: npm ci

      - name: تشغيل Supabase المحلية
        run: |
          docker ps --format 'table {{.Names}}\t{{.Ports}}'
          if command -v ss >/dev/null 2>&1; then
            ss -ltn '( sport = :54322 )'
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          import socket
          import tomllib

          path = Path('supabase/config.toml')
          content = path.read_text(encoding='utf-8')
          config = tomllib.loads(content)
          original_port = config['db']['port']

          with socket.socket() as probe:
              try:
                  probe.bind(('0.0.0.0', original_port))
              except OSError:
                  print(f'CI_DEFAULT_DB_PORT_AVAILABLE=NO ({original_port})')
              else:
                  print(f'CI_DEFAULT_DB_PORT_AVAILABLE=YES ({original_port})')

          def configured_ports(section):
              for key, value in section.items():
                  if key in ('port', 'shadow_port') and isinstance(value, int):
                      yield value
                  elif isinstance(value, dict):
                      yield from configured_ports(value)

          reserved = set(configured_ports(config))
          while True:
              with socket.socket() as probe:
                  probe.bind(('0.0.0.0', 0))
                  selected = probe.getsockname()[1]
              if selected not in reserved:
                  break

          section_start = content.index('[db]\n')
          section_end = content.find('\n[', section_start + 1)
          if section_end < 0:
              section_end = len(content)
          section = content[section_start:section_end]
          updated, count = re.subn(
              r'(?m)^(port[ \t]*=[ \t]*)[0-9]+([ \t]*(?:#.*)?)$',
              lambda match: f'{match.group(1)}{selected}{match.group(2)}',
              section,
          )
          if count != 1:
              raise RuntimeError('Expected exactly one db.port in config.toml')
          path.write_text(
              content[:section_start] + updated + content[section_end:],
              encoding='utf-8',
          )
          if tomllib.loads(path.read_text(encoding='utf-8'))['db']['port'] != selected:
              raise RuntimeError('CI database port was not applied')
          print(f'CI_DB_PORT={selected}')
          PY
          npx supabase start

      - name: npm run c:db
        run: npm run c:db

      # الفهرس المولَّد يجب أن يطابق ما تنتجه القاعدة فعلًا. اختلافه يعني
      # أن الفهرس في المستودع متقادم — والوثائق تُقرأ بدل القاعدة، فيصير
      # التقادم غيابًا كاذبًا لا يكشفه أي اختبار وحدة.
      - name: الفهرس المولَّد يطابق القاعدة
        run: git diff --exit-code -- docs/technical/db

      - name: سجل الفحوص عند الفشل
        if: failure()
        run: tail -n 40 /tmp/wi-checks/*.log || true
