name: well_irrigation_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.2

  # Durable local outbox (W2-02a / ق-115).
  sqflite: ^2.4.1
  path: ^1.9.1
  workmanager: ^0.10.9
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  flutter_contacts: ^2.5.0
  url_launcher: ^6.3.2
  file_picker: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  # مساندة اختبارية لمنتقي الملفات: بناء PlatformFile مزيَّف بلا قنوات.
  cross_file: 0.3.5+5
  file_picker_platform_interface: 3.4.0

  # Runs the real SQLite store in host tests, without a device.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # الخط المعتمد في docs/design/VISUAL_IDENTITY.md §6. يُحزَم في التطبيق ولا
  # يُترك لخط الجهاز: بلا ملف خط يختار كل هاتف خطًّا عربيًّا من عنده، فيختلف
  # عرض الحروف وشكل الأرقام من جهاز إلى جهاز — وفي تطبيق مالي يُقرأ فيه عمود
  # مبالغ، ذلك ليس تفصيلًا. وثلاثة أوزان وحدها كما نصّت الوثيقة (740KB):
  # كل وزن إضافي يزيد الحجم بلا فرق يُرى.
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
